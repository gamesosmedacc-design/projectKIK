<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portal page</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <form id="login_box">
        <img src="assets/img/images-removebg-preview.png" class="logo">
        <p class="start_text"><strong>Login</strong></p>
        <input type="text" id="username" placeholder="username">
        <div id="password_box">
            <input type="password" id="password" class="input_password" placeholder="password">
            <img class="solid_eye" src="assets/icon/eye-solid (2).png">
            <img class="slash_eye" src="assets/icon/eye-slash-solid (2).png">
        </div>
        <p class="link">Belum punya akun? <a id="register_link">Register</a></p>
        <button class="sign_in_btn"><b>Sign in</b></button>
    </form>
    
    <form id="register_box">
        <img src="assets/img/images-removebg-preview.png" class="logo">
        <p class="start_text"><strong>Register sekarang!</strong></p>
        <input type="text" id="create_username" placeholder="Buat username">
        <span style="font-size: 10px; color:red; text-decoration: none; display: none; margin: 0px;" id="usn-note"></span>
        <div id="password_box">
            <img class="solid_eye" src="assets/icon/eye-solid (2).png">
            <img class="slash_eye" src="assets/icon/eye-slash-solid (2).png">
            <input type="password" id="create_password" class="input_password" placeholder="Buat password"><br>
        </div>
        <span style="font-size: 10px; color:red; text-decoration: none; display: none; margin: 0;" id="pw-note"></span>
        <p class="note"><strong>Note : Password harus memiliki kombinasi huruf dan angka!</strong></p>
        <div id="role-wrap">
            <div class="roles active"><span>Guru</span></div>
            <div class="roles"><span>Murid</span></div>
        </div>
        <input type="number" id="create_nis" placeholder="NIS/NIP">
        <span style="font-size: 10px; color:red; text-decoration: none; display: none; margin: 0;" id="nip-note"></span>
        <span style="font-size: 10px; color:red; text-decoration: none; display: none; margin: 0;" id="nis-note"></span>
        <input type="text" id="call_name" placeholder="Nama panggilan   Cth: Xeno">
        <span style="font-size: 10px; color:red; text-decoration: none; display: none; margin: 0;" id="call-note"></span>
        <input type="text" id="subject_teach" placeholder="Mata Pelajaran    Cth: IPAS">
        <span style="font-size: 10px; color:red; text-decoration: none; display: none; margin: 0;" id="mapel-note"></span>
        <input type="text" id="class_" placeholder="Kelas   Cth: XI TKJ">
        <span style="font-size: 10px; color:red; text-decoration: none; display: none; margin: 0;" id="class-note"></span>
        <p class="link">Sudah punya akun? <a id="login_link">Login</a></p>
        <button class="sign_in_btn"><b>Sign in</b></button>
    </form>
    <script src="js/login.js"></script>
    <script src="js/api.js"></script>
    <!--  -->
</body>
</html>
