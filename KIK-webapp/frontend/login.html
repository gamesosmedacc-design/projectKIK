<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portal page</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <form id="login_box">
        <p class="start_text"><strong>LETS START</strong></p>
        <label for="username"><b>Username</b></label>
        <input type="text" id="username" placeholder="username">
        <label for="password"><b>Password</b></label>
        <div id="password_box">
            <img class="solid_eye" src="assets/icon/eye-solid.png">
            <img class="slash_eye" src="assets/icon/eye-slash-solid.png">
            <input type="password" id="password" class="input_password" placeholder="password">
        </div>
        <button class="sign_in_btn"><b>Sign in</b></button>
    </form>
    <script src="js/login.js"></script>
    <script src="js/api.js"></script>
</body>
</html>
