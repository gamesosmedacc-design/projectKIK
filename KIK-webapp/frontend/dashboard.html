<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASHBOARD</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div id="main_container">
        <nav id="top_navigation_bar">
            <img src="assets/img/images-removebg-preview.png" id="profile_pict">
            <h1>Dashboard <span id="greetings"></span>!</h1>
            <img src="assets/icon/bars-solid (1).png" id="bar_icon_btn" alt="bars-solid">
        </nav>
        <div id="main_section">
            <main id="main_content">
                <img src="assets/img/default.jpeg" id="profile_picture">
                <p ><span id="name"></span> | <span id="class_"> </span></p>
                <div id="dashboard_area">
                    <div id="attendance_log">
                        <div class="attendance_card" id="card_hadir">
                            <p class="count" id="hadir-count">0</p>
                            <p>Hadir</p>
                        </div>
                        <div class="attendance_card" id="card_sakit">
                            <p class="count" id="sakit-count">0</p>
                            <p>Sakit</p>
                        </div>
                        <div class="attendance_card" id="card_izin">
                            <p class="count" id="izin-count">0</p>
                            <p>Izin</p>
                        </div>
                    </div>
                    <div id="additional">
                        <div class="items" id="absent_page_btn">
                            <p><strong>Absensi</strong></p>
                        </div>
                    </div>
                        <div id="announcement">
                            <p><strong></strong></p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <dialog id="right_nav_sheet">
        <nav>
            <div id="right_sheet_container">
                <div id="menu">
                    <h2>MENU</h2>
                    <hr width="200" size="2" color="white">
                    <div class="items" id="point-btn">
                        <img src="assets/icon/address-book-solid.png">
                        <p><strong>Poin</strong></p>
                    </div>
                    <div class="items" id="student-status-btn">
                        <img src="assets/icon/user-graduate-solid.png">
                        <p><strong>Siswa</strong></p>
                    </div>
                    <div class="items" id="logout-btn">
                        <img src="assets/icon/arrow-right-from-bracket-solid.png">
                    </div>
                </div>
            </div>
        </nav>
    </dialog>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
