<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASHBOARD</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div id="main_container">
        <nav id="top_navigation_bar">
            <img src="assets/img/default.jpeg" id="profile_pict">
            <h1>Dashboard <span id="greetings">Xeno</span>!</h1>
            <img src="assets/icon/bars-solid (1).png" id="bar_icon_btn" alt="bars-solid">
        </nav>
        <div id="main_section">
            <main id="main_content">
                <img src="assets/img/default.jpeg" id="profile_picture">
                <p ><span id="name">Xeno</span> | <span id="class_"> XII TKJ</span></p>
                <div id="dashboard_area">
                    <div id="attendance_log">
                        <div class="attendance_card" id="card_hadir">
                            <p class="count" id="hadir_count">0</p>
                            <p>Hadir</p>
                        </div>
                        <div class="attendance_card" id="card_sakit">
                            <p class="count" id="sakit_count">0</p>
                            <p>Sakit</p>
                        </div>
                        <div class="attendance_card" id="card_izin">
                            <p class="count" id="izin_count">0</p>
                            <p>Izin</p>
                        </div>
                        <div class="attendance_card" id="card_alpa">
                            <p class="count" id="alpa_count">0</p>
                            <p>Alpa</p>
                        </div>
                    </div>
                    <div id="schedule_info">
                        <div id="current_time">
                            <p>Jam ke 3</p>
                        </div>
                        <div id="current_subject_teacher">
                            <p>Kreativitas Inovasi dan Kewirausahaan</p>
                            <div id="current_teacher">
                                <img src="assets/img/default.jpeg" alt="default-pp" id="pp_guru">
                                <p>Muhammad Mukhlis</p>
                            </div>
                        </div>
                        <div id="next_info">
                            <div id="info_time_subject">
                                <div id="next_time">
                                    <p>Jam ke 4</p>
                                </div>
                                <div id="next_subject">
                                    <p>Kreativitas Inovasi dan Kewirausahaan</p>
                                </div>
                            </div>
                            <div id="next_teacher">
                                <img src="assets/img/default.jpeg" alt="default-pp" id="pp_guru">
                                <p>Muhammad Mukhlis</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <dialog id="right_nav_sheet">
        <nav>
            <div id="right_sheet_container">
                <div id="menu">
                    <h2>MENU</h2>
                    <hr width="200" size="2" color="white">
                    <div class="items" id="absent_page_btn">
                        <img>
                        <p><strong>Absensi</strong></p>
                    </div>
                    <div class="items" id="achievement-btn">
                        <img>
                        <p><strong>Pencapaian</strong></p>
                    </div>
                    <div class="items" id="point-btn">
                        <img>
                        <p><strong>Poin</strong></p>
                    </div>
                    <div class="items" id="history-btn">
                        <img>
                        <p><strong>Riwayat Absen</strong></p>
                    </div>
                    <hr width="200" size="2" color="white">
                    <div class="items" id="settings-btn">
                        <img>
                        <p><strong>Settings</strong></p>
                    </div>
                    <div class="items" id="logout-btn">
                        <img>
                        <p><strong>Log out</strong></p>
                    </div>
                </div>
            </div>
        </nav>
    </dialog>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
