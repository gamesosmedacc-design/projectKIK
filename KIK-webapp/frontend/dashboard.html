<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASHBOARD</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div id="main_container">
        <nav id="top_navigation_bar">
            <img src="assets/img/images-removebg-preview.png" id="profile_pict">
            <h1>Dashboard <span id="greetings"></span>!</h1>
            <img style="display: none;" src="assets/icon/bars-solid (1).png" id="bar_icon_btn" alt="bars-solid">
            <a style="background: #f11; border: 2px solid #f00; border-radius: 6px; margin-right: 12px; padding: 6px; text-align: center;" id="logout-btn">←</a>
        </nav>
        <div id="main_section">
            <main id="main_content">
                <img src="assets/img/default.jpeg" id="profile_picture">
                <p ><span id="name"></span> | <span id="class_"> </span></p>
                <div id="dashboard_area">
                    <div id="attendance_log">
                        <div class="attendance_card" id="card_hadir">
                            <p class="count" id="hadir-count">0</p>
                            <p>Hadir</p>
                        </div>
                        <div class="attendance_card" id="card_sakit">
                            <p class="count" id="sakit-count">0</p>
                            <p>Sakit</p>
                        </div>
                        <div class="attendance_card" id="card_izin">
                            <p class="count" id="izin-count">0</p>
                            <p>Izin</p>
                        </div>
                    </div>
                    <div id="additional">
                        <div class="items" id="absent_page_btn">
                            <p><strong>Absensi</strong></p>
                        </div>
                        <div class="items" id="history_page_btn">
                            <p><strong>Riwayat</strong></p>
                        </div>
                    </div>
                    <div id="teacher-additional">                        
                        <div class="items" id="siswa_page_btn">
                            <p><strong>Status Siswa</strong></p>
                        </div>
                        <div class="items" id="update_page_btn">
                            <p><strong>Perubahan Kehadiran</strong></p>
                        </div>
                    </div>
                        <div id="setting">
                            <p><strong>Pengaturan</strong></p>
                        </div>
                        <div id="announcement">
                            <p><strong></strong></p>
                        </div>
                        <div id="system-setting">
                            <p><strong>Pengaturan Sistem</strong></p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
